# A host port loses its link for longer than dev_loss_tmo: the kernel
# deletes its controllers. When the link comes back, only nvme-discoverd
# (FC kickstart, the nvme discovery uevent) can connect them again.
name = "host port link down 60 s"
recover_timeout = 300

[[steps]]
fault = "fc-link"
host = "host3"
action = "down"
hold = 60

[[steps]]
fault = "fc-link"
host = "host3"
action = "up"
hold = 30
