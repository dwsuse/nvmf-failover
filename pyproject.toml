[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvmf-failover"
version = "0.1.0"
description = "Fault injection and monitoring for NVMe-oF failover tests"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Daniel Wagner", email = "dwagner@suse.de" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ontap = ["paramiko>=3.4"]
dev = [
    "mypy>=1.10",
    "paramiko>=3.4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-paramiko",
]

[project.scripts]
nvmf-failover = "nvmf_failover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # pathlib
    "RUF",      # ruff
    "S",        # bandit
    "C4",       # comprehensions
    "BLE",      # blind except
]
ignore = [
    "S603",     # subprocess without shell: the commands are fixed lists
    "S607",     # partial executable path: systemctl, journalctl, fio, iptables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108"]
# the fixtures are verbatim ONTAP tables
"tests/test_discover.py" = ["E501"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "paramiko.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["nvmf_failover"]
branch = true
